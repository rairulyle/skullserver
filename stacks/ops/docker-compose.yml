name: ops

networks:
  default:
    name: ${NETWORK_NAME}
    external: true

services:
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal:latest
    network_mode: none
    deploy:
      replicas: 1
    environment:
      TZ: ${TZ}
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/healthchecks.png

  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    hostname: SKULLSERVER
    environment:
      TZ: ${TZ}
      WATCHTOWER_CLEANUP: true
      WATCHTOWER_NOTIFICATION_URL: "discord://${DISCORD_TOKEN}@${DISCORD_ID}"
      WATCHTOWER_NOTIFICATIONS: shoutrrr
      WATCHTOWER_SCHEDULE: "0 0 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DATA}/watchtower/config.json:/config.json
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/watchtower.png

  znc:
    container_name: znc
    image: lscr.io/linuxserver/znc:latest
    ports:
      - 6501:6501
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${APP_DATA}/znc:/config
    restart: unless-stopped
    labels:
      npm.proxy.domain: znc.${DOMAIN_NAME}
      npm.proxy.port: "6501"
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/znc.png
      net.unraid.docker.webui: https://znc.${DOMAIN_NAME}

  thelounge:
    container_name: thelounge
    image: lscr.io/linuxserver/thelounge:latest
    ports:
      - 9000:9000
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${APP_DATA}/thelounge:/config
    restart: unless-stopped
    labels:
      npm.proxy.domain: irc.${DOMAIN_NAME}
      npm.proxy.port: "9000"
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/thelounge.png
      net.unraid.docker.webui: https://irc.${DOMAIN_NAME}

  obsidian-ls:
    container_name: obsidian-ls
    image: couchdb:latest
    user: ${PUID}:${PGID}
    ports:
      - 5984:5984
    environment:
      COUCHDB_USER: ${DEFAULT_APP_USERNAME}
      COUCHDB_PASSWORD: ${DEFAULT_APP_PASSWORD}
    volumes:
      - ${APP_DATA}/obsidian-ls/couchdb-data:/opt/couchdb/data
      - ${APP_DATA}/obsidian-ls/couchdb-etc:/opt/couchdb/etc/local.d
    restart: unless-stopped
    labels:
      npm.proxy.domain: obsidian-ls.${DOMAIN_NAME}
      npm.proxy.port: "5984"
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/obsidian.png

  # Two-way sync between the vault's Claude/ folder (via obsidian-ls) and
  # ${APP_DATA}/obsidian-notes/Claude on the host. No published image, so it is
  # built from upstream source pinned to a commit.
  livesync-bridge:
    container_name: livesync-bridge
    image: livesync-bridge:fc0e028
    user: ${PUID}:${PGID}
    build:
      context: https://github.com/vrtmrz/livesync-bridge.git#fc0e028d33b3a12ddee1322951375e05107edc55
    configs:
      - source: livesync-bridge
        target: /app/dat/config.json
    environment:
      TZ: ${TZ}
    # Exception: two mounts. location_data holds the offline-scan state and
    # must survive container recreation; obsidian-notes is the synced folder.
    volumes:
      - ${APP_DATA}/livesync-bridge:/deno-dir/location_data
      - ${APP_DATA}/obsidian-notes:/app/data
    depends_on:
      - obsidian-ls
    healthcheck:
      test:
        [
          "CMD",
          "deno",
          "eval",
          "const h =
            JSON.parse(Deno.readTextFileSync('/tmp/lsb-health.json'));
            Deno.exit(Date.now() - h.ts < 60000 && !h.restartWorthy ? 0 : 1)"
        ]
      interval: 60s
      start_period: 120s
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/obsidian.png
      autoheal: "true"
      com.centurylinklabs.watchtower.enable: "false"

configs:
  # Rendered from .env at deploy time; secrets stay in .env.local. Values are
  # inserted into JSON as-is, so the passphrase must not contain " or \.
  livesync-bridge:
    content: |
      {
        "peers": [
          {
            "type": "couchdb",
            "name": "vault",
            "url": "http://obsidian-ls:5984",
            "database": "obsidian",
            "username": "${DEFAULT_APP_USERNAME}",
            "password": "${DEFAULT_APP_PASSWORD}",
            "passphrase": "${LIVESYNC_PASSPHRASE}",
            "obfuscatePassphrase": "${LIVESYNC_PASSPHRASE}",
            "baseDir": "Claude/",
            "useRemoteTweaks": true
          },
          {
            "type": "storage",
            "name": "server",
            "baseDir": "./data/Claude/",
            "scanOfflineChanges": true,
            "ignore": ["**/.git/**", "**/*.swp", "**/*.tmp", "**/.DS_Store"]
          }
        ]
      }
